<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="475" viewBox="0 0 1250 475" role="img">
<title>Annotation export semantics</title><style>text{font-family:Arial,"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#26384d}.muted{fill:#69788a}.small{font-size:14px}.body{font-size:17px}.heading{font-size:23px;font-weight:600}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#7c91a9"/></marker></defs>
<rect width="100%" height="100%" fill="#f7f9fc"/><text x="28" y="40" class="heading" >导出语义：完整区域与弱提示分开</text><rect x="26" y="65" width="1198" height="310" rx="10" fill="#fff" stroke="#dce3ed"/><text x="42" y="104" class="body" >标记类型</text><text x="292" y="104" class="body" >Labelme JSON</text><text x="650" y="104" class="body" >COCO</text><text x="1000" y="104" class="body" >Mask</text><path d="M40 125H1210" stroke="#e8edf3"/><text x="42" y="151" class="small" >完整区域</text><text x="292" y="151" class="small" >polygon / rectangle / circle</text><text x="650" y="151" class="small" >segmentation + bbox</text><text x="1000" y="151" class="small" >masks/</text><path d="M40 186H1210" stroke="#e8edf3"/><text x="42" y="212" class="small" >弱框</text><text x="292" y="212" class="small" >rectangle + weak=true</text><text x="650" y="212" class="small" >bbox; segmentation=[]</text><text x="1000" y="212" class="small" >weak_masks/</text><path d="M40 247H1210" stroke="#e8edf3"/><text x="42" y="273" class="small" >点 / 线 / 涂鸦</text><text x="292" y="273" class="small" >point / line / linestrip</text><text x="650" y="273" class="small" >weak_annotations.json</text><text x="1000" y="273" class="small" >weak_masks/</text><path d="M40 308H1210" stroke="#e8edf3"/><text x="42" y="334" class="small" >背景提示</text><text x="292" y="334" class="small" >background=true</text><text x="650" y="334" class="small" >weak_annotations.json</text><text x="1000" y="334" class="small" >weak_masks/: 0</text><text x="28" y="411" class="body" >像素值：0 背景 · 1–254 前景类别 · 255 未知 / 忽略</text><text x="28" y="444" class="small muted" >只有弱提示时，完整区域 Mask 保持未知；弱框不是精确分割真值。</text></svg>