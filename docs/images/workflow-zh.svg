<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="265" viewBox="0 0 1250 265" role="img">
<title>Annotation workflow</title><style>text{font-family:Arial,"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#26384d}.muted{fill:#69788a}.small{font-size:14px}.body{font-size:17px}.heading{font-size:23px;font-weight:600}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#7c91a9"/></marker></defs>
<rect width="100%" height="100%" fill="#f7f9fc"/><text x="28" y="40" class="heading" >从图像到数据集</text><rect x="26" y="70" width="226" height="130" rx="10" fill="#fff" stroke="#dce3ed"/><text x="44" y="105" class="small" >01</text><text x="44" y="142" class="body" >打开项目</text><text x="44" y="174" class="small muted" >图像 / Labelme JSON</text><path d="M255 135H268" stroke="#7c91a9" stroke-width="2" marker-end="url(#arrow)"/><rect x="272" y="70" width="226" height="130" rx="10" fill="#fff" stroke="#dce3ed"/><text x="290" y="105" class="small" >02</text><text x="290" y="142" class="body" >添加类别</text><text x="290" y="174" class="small muted" >完整区域或弱提示</text><path d="M501 135H514" stroke="#7c91a9" stroke-width="2" marker-end="url(#arrow)"/><rect x="518" y="70" width="226" height="130" rx="10" fill="#fff" stroke="#dce3ed"/><text x="536" y="105" class="small" >03</text><text x="536" y="142" class="body" >人工描绘</text><text x="536" y="174" class="small muted" >Shift＋左键连续采点</text><path d="M747 135H760" stroke="#7c91a9" stroke-width="2" marker-end="url(#arrow)"/><rect x="764" y="70" width="226" height="130" rx="10" fill="#fff" stroke="#dce3ed"/><text x="782" y="105" class="small" >04</text><text x="782" y="142" class="body" >保存与复核</text><text x="782" y="174" class="small muted" >JSON · 文件时间 · 审核</text><path d="M993 135H1006" stroke="#7c91a9" stroke-width="2" marker-end="url(#arrow)"/><rect x="1010" y="70" width="226" height="130" rx="10" fill="#fff" stroke="#dce3ed"/><text x="1028" y="105" class="small" >05</text><text x="1028" y="142" class="body" >导出数据集</text><text x="1028" y="174" class="small muted" >COCO · JSON · Mask</text><text x="28" y="239" class="small muted" >帧间复用仅复制坐标；每一帧仍需人工检查。</text></svg>