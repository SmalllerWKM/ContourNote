<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="380" viewBox="0 0 1250 380" role="img">
<title>Shift and left-button annotation gesture</title><style>text{font-family:Arial,"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#26384d}.muted{fill:#69788a}.small{font-size:14px}.body{font-size:17px}.heading{font-size:23px;font-weight:600}</style>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#7c91a9"/></marker></defs>
<rect width="100%" height="100%" fill="#f7f9fc"/><text x="28" y="40" class="heading" >Shift＋鼠标左键：连续采点与闭合</text><rect x="26" y="65" width="390" height="248" rx="10" fill="#fff" stroke="#dce3ed"/><text x="46" y="102" class="body" >1. 按住 Shift 和左键</text><circle cx="93" cy="240" r="5" fill="#369c86" stroke="white" stroke-width="2"/><text x="46" y="293" class="small muted" >只按 Shift 不会落点</text><rect x="436" y="65" width="390" height="248" rx="10" fill="#fff" stroke="#dce3ed"/><text x="456" y="102" class="body" >2. 沿边界拖动</text><polyline points="503,240 541,168 609,143 690,164 748,224" fill="none" stroke="#369c86" stroke-width="3"/><circle cx="503" cy="240" r="5" fill="#369c86" stroke="white" stroke-width="2"/><circle cx="541" cy="168" r="5" fill="#369c86" stroke="white" stroke-width="2"/><circle cx="609" cy="143" r="5" fill="#369c86" stroke="white" stroke-width="2"/><circle cx="690" cy="164" r="5" fill="#369c86" stroke="white" stroke-width="2"/><circle cx="748" cy="224" r="5" fill="#369c86" stroke="white" stroke-width="2"/><text x="456" y="293" class="small muted" >松开左键可暂停</text><rect x="846" y="65" width="390" height="248" rx="10" fill="#fff" stroke="#dce3ed"/><text x="866" y="102" class="body" >3. 返回起点附近</text><polygon points="913,240 951,168 1019,143 1100,164 1158,224 1076,257 981,260" fill="#ddf1eb" stroke="#369c86" stroke-width="3"/><circle cx="913" cy="240" r="18" stroke="#87a8c8" stroke-dasharray="4 4" fill="none"/><circle cx="913" cy="240" r="5" fill="#369c86" stroke="white" stroke-width="2"/><circle cx="951" cy="168" r="5" fill="#369c86" stroke="white" stroke-width="2"/><circle cx="1019" cy="143" r="5" fill="#369c86" stroke="white" stroke-width="2"/><circle cx="1100" cy="164" r="5" fill="#369c86" stroke="white" stroke-width="2"/><circle cx="1158" cy="224" r="5" fill="#369c86" stroke="white" stroke-width="2"/><circle cx="1076" cy="257" r="5" fill="#369c86" stroke="white" stroke-width="2"/><circle cx="981" cy="260" r="5" fill="#369c86" stroke="white" stroke-width="2"/><text x="866" y="293" class="small muted" >默认 12 屏幕像素内闭合</text><text x="28" y="350" class="small muted" >示意图：至少 3 点、路径已离开起点且区域有效才自动闭合；采样间距默认 8 屏幕像素。</text></svg>